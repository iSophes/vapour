[package]
name = "Vapour"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
appwrite = "0.2.0"
chrono = "0.4.44"
dotenv = "0.15.0"
gif = "0.14.2"
image = "0.25.10"
nokhwa = "0.10.10"
reqwest = { version = "0.13.2", features = ["json"] }
rqrr = "0.10.1"
serde_json = "1.0.149"
slint = "1.16.1"
tokio = { version = "1.48", features = ["full"] }
tokio-util = "0.7.18"
tokio-utils = "0.1.2"

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
codegen-units = 1
lto = true
